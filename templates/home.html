<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 24px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        form {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 420px;
        }

        input,
        button {
            font-size: 1rem;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        input {
            flex: 1;
            background: #1e293b;
            color: #e2e8f0;
        }

        input:focus {
            outline: 2px solid #38bdf8;
            outline-offset: 1px;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #7dd3fc;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }

        h3.location {
            margin: 0 0 16px;
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.3;
            color: #f1f5f9;
            overflow-wrap: anywhere;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .item {
            background: #0f172a;
            border-radius: 10px;
            padding: 12px;
        }

        .item span {
            display: block;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }

        .value {
            font-size: 1.1rem;
            margin-top: 4px;
        }

        .error {
            color: #fca5a5;
            font-size: 0.875rem;
            min-height: 1.25rem;
        }
    </style>
</head>

<body>

    <h1>Weather</h1>

    <form id="search-form" action="{% url 'home' %}" method="POST">
        {% csrf_token %}
        <input type="text" id="location" name="location" value="{{ city|default:'' }}"
            placeholder="Search a location, e.g. Nairobi" autocomplete="off" required>
        <button type="submit">Search</button>
    </form>

    <p class="error" id="error">{{ error|default:'' }}</p>

    <div class="card">
        <h3 class="location" id="place">{{ city|default:"No location selected" }}</h3>
        <div class="grid">
            <div class="item">
                <span class="label">Coordinates</span>
                <span class="value" id="coordinate">{{ coordinate|default:"--" }}</span>
            </div>
            <div class="item">
                <span class="label">Temperature</span>
                <span class="value" id="temperature">{{ temperature|default:"--" }}</span>
            </div>
            <div class="item">
                <span class="label">Pressure</span>
                <span class="value" id="pressure">{{ pressure|default:"--" }}</span>
            </div>
            <div class="item">
                <span class="label">Humidity</span>
                <span class="value" id="humidity">{{ humidity|default:"--" }}</span>
            </div>
        </div>
    </div>

</body>

</html>
